name: Feature proposal
description: Suggest a focused improvement.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the simplest useful behavior and any alternatives.
    validations:
      required: true
