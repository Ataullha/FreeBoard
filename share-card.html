<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FreeBoard — Launch image artwork</title>
  </head>
  <body>
    <article class="share-card" aria-label="FreeBoard launch image">
      <header>
        <div class="share-brand">
          <img
            src="./icons/freeboard.svg"
            alt=""
            width="36"
            height="36"
          />FreeBoard
        </div>
        <span class="share-badge">FREE &amp; OPEN SOURCE</span>
      </header>
      <div class="share-copy">
        <p class="share-eyebrow">A QUIET PLACE TO THINK</p>
        <h1>
          Make space<br />for
          <span
            >ideas.<svg viewBox="0 0 250 18" aria-hidden="true">
              <path d="M4 8C58 0 157 1 244 9M24 16C107 8 165 9 216 13" /></svg
          ></span>
        </h1>
        <p class="share-description">
          Your ideas. Your browser.<br />A whiteboard for clearer thinking.
        </p>
      </div>
      <div class="share-product">
        <img
          src="./showcase/lesson.jpg"
          width="1363"
          height="936"
          alt="The actual FreeBoard app with a lesson, Bengali and English text, pen width slider and local clock."
        />
      </div>
      <footer>
        <span class="share-url"
          >ataullha.github.io/FreeBoard<span>↗</span></span
        >
        <div>
          <span>Draw naturally</span><i></i><span>Save locally</span><i></i
          ><span>Work offline</span>
        </div>
      </footer>
    </article>
    <script type="module" src="/src/showcase/share-card.ts"></script>
  </body>
</html>
